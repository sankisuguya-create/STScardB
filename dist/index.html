<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>こころの冒険</title>
<style>
/* 仮の見た目（あとで差し替える）。色の役割はトークンで定義する */
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #1f2328; --sub: #57606a; --line: #d0d7de;
  --primary: #1f6feb; --primary-ink: #fff;
  --good: #1a7f37; --bad: #b42318; --warn: #9a6700;
  --think: #3b5bdb; --act: #d9480f; --relate: #2b8a3e; --calm: #0c8599; --impulse: #c92a2a; --basic: #6e7781; --curse: #5f3dc4;
  --yoyu: #2f9e44; --hp: #e8590c;
  --radius: 10px;
  font-family: "Hiragino Sans", "Yu Gothic UI", "BIZ UDPGothic", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #16181c; --panel: #22262c; --ink: #e6edf3; --sub: #9da7b3; --line: #3a414a; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-size: 16px; -webkit-tap-highlight-color: transparent; }
#app { display: flex; flex-direction: column; height: 100vh; max-width: 1366px; margin: 0 auto; }
button { font: inherit; border-radius: var(--radius); border: 2px solid var(--line); background: var(--panel); color: var(--ink); padding: 10px 18px; min-height: 48px; cursor: pointer; touch-action: manipulation; }
button.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 700; }
button.secondary { background: transparent; border-color: var(--primary); color: var(--primary); }
button:disabled { opacity: .45; cursor: default; }
button.big { font-size: 1.3rem; min-width: 220px; min-height: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
button small { font-size: .85rem; font-weight: 400; }
h1, h2, h3 { margin: .3em 0; }
.hint { color: var(--sub); margin: 4px 0; }
.lbl { font-size: .8rem; color: var(--sub); margin-right: 6px; }

.top { display: flex; align-items: center; gap: 12px; padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.meter { display: flex; align-items: center; gap: 6px; min-width: 260px; }
.meter .bar { flex: 1; height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; min-width: 120px; }
.meter .fill { height: 100%; background: var(--yoyu); transition: width .25s; }
.meter.low .fill { background: var(--bad); }
.meter.low b::after { content: " ！"; color: var(--bad); }
.meter.hp .fill { background: var(--hp); }
.chip { display: inline-flex; align-items: baseline; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.chip b { font-size: 1.1rem; }
.stats { display: flex; gap: 6px; }
.chip.st-think { border-color: var(--think); } .chip.st-act { border-color: var(--act); } .chip.st-relate { border-color: var(--relate); }
.floor { margin-left: auto; color: var(--sub); }

main { flex: 1; overflow: auto; padding: 10px 14px; }
.title { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
.title h1 { font-size: 2.6rem; }
.sub { color: var(--sub); font-size: 1.1rem; }

.map { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.maprow { display: flex; align-items: center; gap: 14px; }
.maprow.past { opacity: .4; }
.maprow .rownum { width: 70px; color: var(--sub); text-align: right; }
.node { min-width: 180px; min-height: 64px; font-size: 1.15rem; font-weight: 700; }
.maprow.now .node:not(:disabled) { border-width: 3px; box-shadow: 0 2px 0 var(--line); }
.n-battle { border-color: var(--act); } .n-elite { border-color: var(--impulse); } .n-event { border-color: var(--think); } .n-rest { border-color: var(--yoyu); } .n-boss { border-color: var(--curse); }

.battle { display: flex; flex-direction: column; gap: 8px; }
.enemy { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 8px 14px; }
.enemy.k-elite { border-color: var(--impulse); } .enemy.k-boss { border-color: var(--curse); }
.ekind { font-size: .85rem; color: var(--sub); }
.ename { font-size: 1.5rem; }
.ename.unsure { text-decoration: underline dotted; }
.unsure-note, .note { font-size: .9rem; color: var(--warn); }
.intent b { font-size: 1.05rem; }
.msgs { min-height: 52px; }
.msgs p { margin: 2px 0; font-size: .95rem; }
.m-fail, .m-backfire, .m-curse, .m-stress { color: var(--bad); }
.m-next, .m-reveal, .m-ally { color: var(--good); font-weight: 700; }
.row { display: flex; align-items: center; gap: 10px; }
.me { display: flex; gap: 8px; align-items: center; }
.piles { color: var(--sub); font-size: .85rem; }
.endturn { margin-left: auto; min-width: 180px; }
.hand { display: flex; gap: 8px; align-items: stretch; }
.card { position: relative; flex: 1 1 0; min-width: 118px; max-width: 180px; background: var(--panel); border: 2px solid var(--line); border-top: 8px solid var(--basic); border-radius: var(--radius); padding: 8px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: transform .12s; user-select: none; }
.card.selected { transform: translateY(-10px); box-shadow: 0 6px 14px rgba(0,0,0,.18); border-color: var(--primary); }
.card.off { opacity: .55; }
.card.temp { border-style: dashed; }
.card .cost { position: absolute; top: -14px; left: -6px; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--panel); display: grid; place-items: center; font-weight: 700; }
.ctype { font-size: .75rem; color: var(--sub); text-align: right; }
.cname { font-weight: 700; font-size: 1rem; line-height: 1.3; }
.cline { font-size: .82rem; color: var(--sub); line-height: 1.35; }
.fxs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
.fx { font-size: .8rem; padding: 1px 6px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.fx.bad { color: var(--bad); border-color: var(--bad); }
.fx.trust, .fx.reveal { color: var(--good); border-color: var(--good); }
.chance { font-size: .75rem; color: var(--warn); }
.tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag { font-size: .75rem; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--sub); }
.tag.good { color: var(--good); border-color: var(--good); }
.tag.bad { color: var(--bad); border-color: var(--bad); }
.lock { font-size: .78rem; color: var(--bad); font-weight: 700; }
.t-think { border-top-color: var(--think); } .t-act { border-top-color: var(--act); } .t-relate { border-top-color: var(--relate); }
.t-calm { border-top-color: var(--calm); } .t-impulse { border-top-color: var(--impulse); } .t-curse { border-top-color: var(--curse); background: repeating-linear-gradient(45deg, var(--panel), var(--panel) 8px, var(--bg) 8px, var(--bg) 16px); }

.reward, .rest, .event { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.choices { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.choices .card { width: 180px; flex: none; min-height: 200px; }
.choices.small .card { width: 140px; min-height: 150px; }
.other { background: var(--panel); border-left: 4px solid var(--relate); padding: 8px 12px; max-width: 760px; }
.two { display: flex; gap: 24px; }
.story { font-size: 1.15rem; max-width: 760px; }
.opts { display: flex; flex-direction: column; gap: 10px; min-width: 420px; }
.opt { text-align: left; font-size: 1.1rem; display: flex; flex-direction: column; align-items: flex-start; }
.result { font-size: 1.1rem; background: var(--panel); padding: 10px 14px; border-radius: var(--radius); }

.end { max-width: 900px; margin: 0 auto; width: 100%; }
.verdict { font-size: 1.4rem; font-weight: 700; text-align: center; }
.verdict.won { color: var(--good); }
.growlist { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.growlist li { background: var(--panel); border-left: 6px solid var(--relate); padding: 8px 12px; border-radius: 6px; display: flex; flex-direction: column; }
.growlist li.unlock { border-left-color: var(--primary); }
.growlist b { font-size: 1.1rem; }
.praise { background: var(--panel); border: 2px solid var(--good); padding: 8px 12px; border-radius: var(--radius); font-weight: 700; }
.trustbox { margin-top: 10px; }
.trustchart { width: 100%; max-width: 520px; height: 120px; background: var(--panel); border-radius: var(--radius); }
.trustchart .tline { fill: none; stroke: var(--primary); stroke-width: 3; }
.trustchart circle.up { fill: var(--good); } .trustchart circle.down { fill: var(--bad); } .trustchart circle.flat { fill: var(--sub); }
.grad { color: var(--good); font-weight: 700; }
.reveals s { color: var(--sub); }
.reveals small { display: block; color: var(--sub); }
.grid4 { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 8px; }
.gh { font-weight: 700; text-align: center; align-self: end; }
.gh.side { align-self: center; text-align: right; }
.cell { background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius); padding: 10px; min-height: 110px; }
.cell small { display: block; color: var(--sub); }
.cell .num { font-size: 1.6rem; font-weight: 700; }
.cell.g-ng { border-color: var(--good); }
.cell.i-ok { border-color: var(--warn); }
.nav { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; }
.dots { color: var(--sub); }
.ctx { font-size: .75rem; color: var(--sub); }
.m-bench { color: var(--sub); }

</style>
</head>
<body>
<div id="app"></div>
<script>
// カード・課題・できごと・文面の正本。数値と文面はここだけで定義する。
// 対象：小学3年。漢字は3年までの配当に寄せ、迷う字はひらがなにする。
(function (root) {
  'use strict';

  var STATS = {
    think: { name: 'かしこさ', verb: '考える' },
    act: { name: '行動', verb: '動く' },
    relate: { name: 'なかま力', verb: '関わる' }
  };

  var CTX_LABEL = { study: 'べんきょう', conflict: 'ぶつかり合い', join: '遊び・なかま', tease: 'からかい', stage: '発表' };

  var TYPE_LABEL = {
    think: '考える', act: '動く', relate: '関わる', calm: '整える',
    impulse: 'しょうどう', basic: 'きほん', curse: 'モヤモヤ'
  };

  // うまくいきやすさ（3段階）。％は児童に見せない
  var CHANCE = {
    high: { p: 0.85, label: 'たいてい うまくいく' },
    mid: { p: 0.6, label: 'ときどき うまくいく' },
    low: { p: 0.35, label: 'うまくいくのは むずかしい' }
  };

  var PLAYER = { maxYoyu: 50, energy: 3, hand: 5, statMax: 5, trustStart: 5, trustMax: 10 };

  var RULES = {
    stressThreshold: 0.3,      // 心の余裕がこの割合未満でカッとなるが手札にまざる
    growthUses: 3,             // 1回の戦いで同じ種類を3回使うと成長
    trustGainCapPerBattle: 2,  // カードによる信頼の上昇は1戦で2まで
    weak: 1.5, resist: 0.5, anxiety: 0.6,
    restHeal: 0.3, backfireGrow: 3, moyaDrain: 2, allyTrust: 7, allyGuard: 6, hpScale: 1.4, stressScale: 1.35,
    rewardChoices: 3, rewardChoicesHighTrust: 4, highTrust: 8, lowTrust: 3
  };

  // ctx: そのカードが合う場面。書いていないカードはどの場面でも使える。合わない場面では、その戦いの間 山札から外す
  // judge: good=向社会的・アサーティブ・整える／impulse=しょうどう／neutral=きほん
  // style: 振り返りのアサーション3分類（aggressive/passive/assertive）
  var CARDS = {
    // --- 初期デッキ ---
    try_it: { name: 'トライする', line: 'とにかく 一度 やってみる。', type: 'act', judge: 'neutral', style: 'assertive', cost: 1, solve: 5, ctx: ['study', 'join', 'stage'] },
    endure: { name: 'がまんする', line: 'ぐっと こらえる。', type: 'basic', judge: 'neutral', style: 'passive', cost: 1, guard: 5 },
    breathe: { name: '深こきゅう', line: 'ゆっくり 3回 いきをすう。', type: 'calm', judge: 'good', style: 'assertive', cost: 1, guard: 4, draw: 1 },
    talk: { name: '話してみる', line: '「ねえ、ちょっといい？」', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 4 },
    snap_back: { name: '言い返す', line: '「そっちこそ！」', type: 'impulse', judge: 'impulse', style: 'aggressive', cost: 0, solve: 9, chance: 'high', trust: -1, curse: true, ctx: ['conflict', 'tease'] },

    // --- 報酬で手に入るカード ---
    write_plan: { name: 'やることを紙に書く', line: '1. 2. 3. と じゅんばんに書く。', type: 'think', judge: 'good', style: 'assertive', cost: 1, solve: 4, draw: 1, ctx: ['study', 'stage'] },
    their_view: { name: '相手の気もちを考える', line: '「あの子は どう思ったかな？」', type: 'think', judge: 'good', style: 'assertive', cost: 1, guard: 4, reveal: true, ctx: ['conflict', 'join', 'tease'] },
    start_now: { name: 'すぐ取りかかる', line: 'あとまわしに しない。', type: 'act', judge: 'good', style: 'assertive', cost: 1, solve: 8, ctx: ['study', 'stage'] },
    move_body: { name: '体を動かして 気分てんかん', line: '休み時間に 外で走る。', type: 'act', judge: 'good', style: 'assertive', cost: 1, heal: 5, exhaust: true },
    together: { name: '「いっしょにやろう」', line: '「いっしょにやろう」と 声をかける。', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 6, trust: 1, chance: 'high', ctx: ['study', 'join'] },
    thanks: { name: '「ありがとう」を つたえる', line: '「さっきは ありがとう」', type: 'relate', judge: 'good', style: 'assertive', cost: 0, guard: 3, trust: 1 },
    apologize: { name: 'あやまる', line: '「さっきは ごめんね」', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 3, trust: 2, ctx: ['conflict', 'join'] },
    lead: { name: 'みんなを まとめる', line: '「じゃあ、じゅんばんに 言っていこう」', type: 'relate', judge: 'good', style: 'assertive', cost: 2, solve: 14, chance: 'mid', req: { relate: 2, trust: 6 }, ctx: ['study', 'join'] },
    name_feeling: { name: '気もちを 言葉にする', line: '「いま、ちょっと くやしい」', type: 'calm', judge: 'good', style: 'assertive', cost: 1, guard: 7 },

    // --- 場面カード（その戦いの間だけ手札に入る） ---
    say_dunno: { name: '「わからない」と言う', line: '「ここが わかりません」', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 8, chance: 'high' },
    ask_next: { name: 'となりの人に 聞く', line: '「ここ、どうやった？」', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 7, chance: 'mid', fail: 'ask_teacher' },
    ask_teacher: { name: '先生に 聞く', line: '「先生、ここを 教えてください」', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 7, chance: 'high' },
    skip_it: { name: 'とばして 次へ', line: 'わからない問題は あとで。', type: 'think', judge: 'neutral', style: 'passive', cost: 1, guard: 4, solve: 2 },

    ask_ok: { name: '「だいじょうぶ？」と聞く', line: '「だいじょうぶ？ いま、ぶつかったよね」', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 6, reveal: true, chance: 'high' },
    watch_them: { name: '相手の ようすを見る', line: 'あわてている？ わらっている？', type: 'think', judge: 'good', style: 'assertive', cost: 1, guard: 3, reveal: true },
    hit_back: { name: 'やり返す', line: 'どんっと おし返す。', type: 'impulse', judge: 'impulse', style: 'aggressive', cost: 0, solve: 10, chance: 'high', trust: -2, curse: true },

    let_me_in: { name: '「入れて」と言う', line: '「ねえ、入れて！」', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 10, chance: 'mid', fail: 'next_time' },
    next_time: { name: '「次は 入れてね」', line: '「じゃあ、次は 入れてね」', type: 'relate', judge: 'good', style: 'assertive', cost: 0, solve: 5, chance: 'high' },
    invite_other: { name: 'ほかの遊びに さそう', line: '「おにごっこ しない？」', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 6, trust: 1, chance: 'high' },
    consult: { name: '先生に そうだんする', line: '「先生、ちょっと 聞いてほしいことが あります」', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 7, chance: 'high' },
    sulk: { name: 'ひとりで すねる', line: 'もういいよ、と はなれる。', type: 'impulse', judge: 'impulse', style: 'passive', cost: 0, guard: 8, chance: 'high', trust: -1, curse: true },

    say_stop: { name: '「いやだ」と はっきり言う', line: '「それ、いやだから やめて」', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 9, chance: 'mid', fail: 'walk_away' },
    walk_away: { name: 'その場を はなれる', line: 'だまって 先生の近くへ 行く。', type: 'act', judge: 'good', style: 'assertive', cost: 0, guard: 6, chance: 'high' },
    tell_teacher: { name: '先生に つたえる', line: '「何回も 言われて こまっています」', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 10, chance: 'high', reveal: true },

    read_memo: { name: 'メモを見ながら 話す', line: '書いておいたことを 読む。', type: 'think', judge: 'good', style: 'assertive', cost: 1, solve: 9, chance: 'high' },
    breathe_first: { name: '深こきゅうして 始める', line: 'すって、はいて、「はじめます」', type: 'calm', judge: 'good', style: 'assertive', cost: 1, guard: 6 },
    friend_face: { name: '友だちの顔を見る', line: 'うなずいてくれる子を さがす。', type: 'relate', judge: 'good', style: 'assertive', cost: 1, guard: 5, solve: 5, req: { trust: 6 } },
    give_up: { name: '「やっぱり やめる」', line: 'だまって すわってしまう。', type: 'impulse', judge: 'impulse', style: 'passive', cost: 0, guard: 12, chance: 'high', trust: -1, curse: true },

    // --- ストレスで入りこむカード・モヤモヤ ---
    kattonaru: { name: 'カッとなる', line: '頭が まっ白になって 大声を出す。', type: 'impulse', judge: 'impulse', style: 'aggressive', cost: 0, solve: 12, chance: 'high', trust: -2, curse: true, exhaust: true },
    moyamoya: { name: 'モヤモヤ', line: 'あのときのことが 気になって 手につかない。', type: 'curse', judge: 'curse', cost: 0, unplayable: true }
  };

  var STARTER = ['try_it', 'try_it', 'try_it', 'try_it', 'endure', 'endure', 'endure', 'endure', 'breathe', 'talk', 'snap_back'];
  var REWARD_POOL = ['write_plan', 'their_view', 'start_now', 'move_body', 'together', 'thanks', 'apologize', 'lead', 'name_feeling'];

  // moves: stress=心の余裕を n へらす／grow=問題が大きくなる（以後の stress に +n）／worry=モヤモヤを1まい まぜる
  // view: 最初は「見え方」の名前で出る。reveal カードで「ほんとう」がわかる
  var ENEMIES = {
    dunno: {
      ctx: 'study', scene: 'わからない問題', name: 'わからない問題', kind: 'normal', hp: 24,
      moves: [{ t: 'stress', n: 6, say: 'あせってくる' }, { t: 'grow', n: 2, say: 'どんどん むずかしく見えてくる' }, { t: 'stress', n: 7, say: 'まわりが すすんでいく' }],
      weak: ['relate', 'think'], resist: [], situ: ['say_dunno', 'ask_next', 'skip_it'],
      other: 'となりの子：「聞いてくれたら、すぐ 教えたのに」'
    },
    bumped: {
      ctx: 'conflict', scene: 'ろうかで ぶつかられた', name: 'わざと ぶつかられた？', kind: 'normal', hp: 20,
      moves: [{ t: 'stress', n: 7, say: 'むかむかしてくる' }, { t: 'stress', n: 8, say: '「わざとだ」と思えてくる' }],
      weak: [], resist: ['relate'], backfire: [], situ: ['ask_ok', 'watch_them', 'hit_back'],
      view: { truth: 'benign', name: 'よそ見して ぶつかっただけ', weak: ['relate'], resist: [], backfire: ['impulse'], stressMul: 0.5 },
      other: 'ぶつかった子：「あっ、ごめん！ 前を見てなかった」'
    },
    left_out: {
      ctx: 'join', scene: '遊びに 入れない', name: '遊びに 入れない', kind: 'normal', hp: 28,
      moves: [{ t: 'stress', n: 6, say: 'さびしくなる' }, { t: 'worry', say: '「きらわれてる？」と考えてしまう' }, { t: 'stress', n: 8, say: '休み時間が おわっていく' }],
      weak: ['relate'], resist: [], backfire: ['impulse'], situ: ['let_me_in', 'invite_other', 'sulk'],
      other: '遊んでいた子：「人数が ちょうどだったから、気づかなかった」'
    },
    teased: {
      ctx: 'tease', scene: 'からかわれた', name: 'からかわれた', kind: 'elite', hp: 36,

    var fallback = null;
    if (!items.length && !trustUps.length && !cards.length) {
      var most = mostUsed();
      fallback = h('p', { class: 'praise', text: '今回は ' + (most ? cardName(most) + 'で たくさん 乗りこえた。' : 'さいごまで あきらめずに 考えた。') + '次は「わからないと言う」や「いっしょにやろう」も ためせるよ。' });
    }
    return [
      h('h2', { text: 'そだったもの' }),
      h('ul', { class: 'growlist' }, items),
      fallback,
      trustBox,
      cards.length ? h('div', {}, [h('h3', { text: '選択肢' }), h('ul', {}, cards)]) : null
    ];
  }
  function groupUps(ups) {
    var by = {}, order = [];
    ups.forEach(function (e) {
      if (!by[e.why]) { by[e.why] = { why: e.why, d: 0, n: 0 }; order.push(e.why); }
      by[e.why].d += e.d; by[e.why].n++;
    });
    return order.map(function (k) { return by[k]; });
  }
  function mostUsed() {
    var cnt = {};
    S.log.forEach(function (e) { if (e.k === 'play') cnt[e.card] = (cnt[e.card] || 0) + 1; });
    var best = null;
    Object.keys(cnt).forEach(function (k) { if (!best || cnt[k] > cnt[best]) best = k; });
    return best;
  }

  function debriefView(sm) {
    return [
      h('h2', { text: '見方が 変わった・見つけた' }),
      sm.reveals.length ? h('ul', { class: 'reveals' }, sm.reveals.map(function (r) {
        return h('li', {}, [h('s', { text: r.from }), ' → ', h('b', { text: r.to }),
          h('small', { text: r.truth === 'hostile' ? '（たしかめたら、ほんとうに いやなことだった。だから 先生に つたえるのが 大事）' : '（たしかめたら、わざとじゃなかった）' })]);
      })) : h('p', { text: '今回は「見方を 変える」カードを 使わなかった。次は「相手の ようすを見る」を ためしてみよう。' }),
      h('h3', { text: 'この場面で、こんな 選択肢が あった' }),
      h('ul', {}, sm.discovered.map(function (d) { return h('li', { text: D.ENEMIES[d.enemy].scene + '：' + cardName(d.card) }); })),
      h('h3', { text: '相手から 見ると' }),
      h('ul', { class: 'others' }, sm.others.map(function (o) { return h('li', { text: o.other }); }))
    ];
  }

  function debriefGrid(sm) {
    function cell(cls, title, sub, list) {
      var ex = list[0];
      return h('div', { class: 'cell ' + cls }, [
        h('b', { text: title }), h('small', { text: sub }),
        h('div', { class: 'num', text: list.length + '回' }),
        ex ? h('p', { text: '例：' + cardName(ex.card) }) : null
      ]);
    }
    var g = sm.grid;
    return [
      h('h2', { text: '選び方と 結果' }),
      h('div', { class: 'grid4' }, [
        h('div', {}), h('div', { class: 'gh', text: 'うまくいった' }), h('div', { class: 'gh', text: 'うまくいかなかった' }),
        h('div', { class: 'gh side', text: 'よい選び方' }),
        cell('g-ok', 'よかった', '', g.goodOk),
        cell('g-ng', 'ナイストライ', '選び方は よかった。こういう日も ある', g.goodNg),
        h('div', { class: 'gh side', text: 'しょうどう' }),
        cell('i-ok', 'ラッキー（でもモヤモヤ）', 'その場は おさまったけど…', g.impOk),
        cell('i-ng', 'うまくいかなかった', '', g.impNg)
      ]),
      h('p', { class: 'hint', text: '結果だけで、選び方の よしあしは きまらない。ほんとうの 生活なら、どれを えらぶ？' })
    ];
  }

  function endScreen() {
    var sm = E.summary(S);
    var pages = [debriefGrow, debriefView, debriefGrid];
    var body = pages[debriefPage](sm);
    var nav = h('div', { class: 'nav' }, [
      debriefPage > 0 ? h('button', { class: 'secondary', onclick: function () { debriefPage--; render(); }, text: 'もどる' }) : h('span'),
      h('span', { class: 'dots', text: (debriefPage + 1) + ' / ' + pages.length }),
      debriefPage < pages.length - 1
        ? h('button', { class: 'primary', onclick: function () { debriefPage++; render(); }, text: '次へ' })
        : h('button', { class: 'primary', onclick: function () { P.clear(); start(); }, text: 'もう一回' })
    ]);
    return h('main', { class: 'end' }, [
      h('p', { class: 'verdict ' + (sm.won ? 'won' : 'lost'), text: sm.won ? D.TEXT.win : D.TEXT.lose })
    ].concat(body, [nav]));
  }

  function render() {
    if (!S) return;
    var screen;
    if (S.phase === 'map') screen = mapScreen();
    else if (S.phase === 'battle') screen = battleScreen();
    else if (S.phase === 'reward') screen = rewardScreen();
    else if (S.phase === 'rest') screen = restScreen();
    else if (S.phase === 'event') screen = eventScreen();
    else screen = endScreen();
    app.replaceChildren(topBar(), screen);
    app.setAttribute('data-phase', S.phase);
  }

  function boot() {
    app = document.getElementById('app');
    P.load(function (saved) {
      if (saved && saved.ver === E.ENGINE_VER && saved.phase !== 'end') titleScreen(saved);
      else titleScreen(null);
    });
  }

  root.SST_UI = { boot: boot, _state: function () { return S; } };
})(this);

SST_UI.boot();
</script>
</body>
</html>

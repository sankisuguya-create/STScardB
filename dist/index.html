<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>こころの冒険</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<style>
/* 見た目レベル3：ドットの舞台（案A）＋ 課題から出る吹き出しの文字盤。
   色は役割ごとのトークン。種類・状態は色だけでなく文字でも出す */
:root {
  --bg: #e9ecf3; --ink: #1c2230; --sub: #5b6578; --line: #12172a; --paper: #fffdf7; --panel: #ffffff;
  --stage-top: #283153; --stage-bot: #3d4a7d; --floor: #4b5a92;
  --primary: #2f6fe4; --primary-ink: #fff; --gold: #ffd23f;
  --good: #1a7f37; --bad: #c4262e; --warn: #9a6700;
  --think: #3b5bdb; --act: #e0661b; --relate: #2b8a3e; --calm: #0c8599; --impulse: #c92a2a; --basic: #6e7781; --curse: #5f3dc4;
  --yoyu: #27a35a; --hp: #e8692a;
  --radius: 10px; --shadow: 0 4px 0 var(--line);
  --display: "DotGothic16", "BIZ UDGothic", "Hiragino Sans", monospace;
  --body: "M PLUS Rounded 1c", "Hiragino Sans", "Yu Gothic UI", "BIZ UDPGothic", "Noto Sans JP", sans-serif;
  font-family: var(--body);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-size: 16px; -webkit-tap-highlight-color: transparent; }
#app { display: flex; flex-direction: column; height: 100vh; max-width: 1366px; margin: 0 auto; }
h1, h2, h3 { margin: .3em 0; font-family: var(--display); font-weight: 400; }
button { font: inherit; border-radius: var(--radius); border: 3px solid var(--line); background: var(--panel); color: var(--ink); padding: 10px 18px; min-height: 48px; cursor: pointer; touch-action: manipulation; box-shadow: var(--shadow); transition: transform .08s; }
button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button.primary { background: var(--primary); color: var(--primary-ink); font-family: var(--display); font-size: 1.15rem; }
button.secondary { background: var(--panel); color: var(--primary); font-weight: 800; }
button:disabled { opacity: .45; cursor: default; box-shadow: none; }
button.big { font-size: 1.3rem; min-width: 220px; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
button small { font-size: .85rem; font-family: var(--body); }
.hint { color: var(--sub); margin: 4px 0; }
.lbl { font-size: .78rem; color: var(--sub); margin-right: 6px; }
canvas.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* 上の帯 */
.top { display: flex; align-items: center; gap: 10px; padding: 6px 14px; background: var(--line); color: #fff; flex-wrap: wrap; }
.top .lbl { color: #b8c2dc; }
.meter { display: flex; align-items: center; gap: 6px; min-width: 250px; }
.meter .bar { flex: 1; height: 16px; background: rgba(0,0,0,.3); border: 2px solid var(--line); border-radius: 4px; overflow: hidden; min-width: 120px; }
.top .meter .bar { border-color: #fff; }
.meter .fill { height: 100%; background: var(--yoyu); transition: width .35s; }
.meter.low .fill { background: var(--bad); animation: pulse 1s steps(2) infinite; }
.meter.low b::after { content: " ！"; color: #ff8a8a; }
.meter.hp .fill { background: var(--hp); }
.chip { display: inline-flex; align-items: baseline; padding: 3px 10px; border: 2px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); }
.chip b { font-size: 1.1rem; font-family: var(--display); font-weight: 400; }
.chip .lbl { color: var(--sub); }
.stats { display: flex; gap: 6px; }
.chip.st-think { box-shadow: inset 0 -4px 0 var(--think); } .chip.st-act { box-shadow: inset 0 -4px 0 var(--act); } .chip.st-relate { box-shadow: inset 0 -4px 0 var(--relate); }
.floor { margin-left: auto; font-family: var(--display); }

main { flex: 1; overflow: auto; padding: 10px 14px; }
.title { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: linear-gradient(var(--stage-top), var(--stage-bot)); color: #fff; }
.title h1 { font-size: 3rem; text-shadow: 0 4px 0 var(--line); }
.sub { color: #d6dcf0; font-size: 1.1rem; }

/* マップ */
.map { display: flex; flex-direction: column; gap: 12px; align-items: center; background: linear-gradient(var(--stage-top), var(--stage-bot)); color: #fff; }
.map .hint { color: #d6dcf0; }
.maprow { display: flex; align-items: center; gap: 16px; }
.maprow.past { opacity: .35; }
.maprow .rownum { width: 72px; color: #b8c2dc; text-align: right; font-family: var(--display); }
.node { min-width: 180px; min-height: 64px; font-size: 1.15rem; font-family: var(--display); }
.maprow.now .node:not(:disabled) { animation: bob 1.4s steps(2) infinite; }
.n-battle { background: #ffe3cf; } .n-elite { background: #ffd0d0; } .n-event { background: #dbe4ff; } .n-rest { background: #d3f5df; } .n-boss { background: #e5dbff; }

/* 戦い：舞台 */
.battle { display: flex; flex-direction: column; gap: 6px; padding: 0; overflow: hidden; }
.stage { position: relative; height: 340px; flex: none; background: linear-gradient(var(--stage-top) 0 74%, var(--floor) 74%); border-bottom: 4px solid var(--line); display: grid; grid-template-columns: 220px 1fr 300px; align-items: end; padding: 0 22px 16px; gap: 10px; }
.items { position: absolute; left: 16px; top: 12px; display: flex; gap: 8px; align-items: flex-start; z-index: 2; }
.item { width: 64px; height: 64px; min-height: 0; padding: 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--paper); }
.item canvas { width: 40px; height: 40px; }
.item .iname { font-size: 9px; line-height: 1.1; font-weight: 700; }
.item.selected { background: var(--gold); transform: translateY(-3px); }
.item.used { opacity: .35; filter: grayscale(1); }
.item.empty { width: 64px; height: 64px; border: 3px dashed #8d98bd; border-radius: var(--radius); }
.itemtip { max-width: 320px; background: var(--paper); border: 3px solid var(--line); border-radius: var(--radius); padding: 6px 10px; display: flex; flex-direction: column; gap: 2px; font-size: .85rem; box-shadow: var(--shadow); }
.hero { grid-column: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.hero canvas.me { width: 140px; height: 140px; }
.chip.guard.on { background: #cfe6ff; }
.monster { grid-column: 3; justify-self: center; }
.monster canvas.mon { width: 260px; height: 260px; animation: bob 1.6s steps(2) infinite; }
.monster.f1 canvas.mon { animation: bob 1.6s steps(2) infinite, flick 1.2s steps(2) infinite; }
.monster.f2 canvas.mon { animation: none; }
.bubble { grid-column: 2; align-self: center; justify-self: center; width: 100%; max-width: 640px; position: relative; background: var(--paper); border: 3px solid var(--line); border-radius: 14px; padding: 10px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
.bubble::before { content: ""; position: absolute; right: -22px; top: 46%; border: 11px solid transparent; border-left: 11px solid var(--line); }
.bubble::after { content: ""; position: absolute; right: -15px; top: calc(46% + 2px); border: 9px solid transparent; border-left: 9px solid var(--paper); }
.bubble.k-elite { box-shadow: 0 4px 0 var(--impulse); } .bubble.k-boss { box-shadow: 0 4px 0 var(--curse); }
.ekind { font-size: .82rem; color: var(--sub); }
.ename { font-size: 1.6rem; margin: 0; }
.intent b { font-size: 1.05rem; }
.passin { font-size: .9rem; color: var(--calm); font-weight: 800; }
.passin.no { color: var(--sub); font-weight: 500; }
.forms { display: flex; gap: 4px; }
.fstep { font-size: .75rem; padding: 1px 8px; border: 2px solid var(--line); border-radius: 999px; color: var(--sub); }
.fstep.on { background: var(--calm); color: #fff; }
.unsure-note, .note { font-size: .85rem; color: var(--warn); }
.row { display: flex; align-items: center; gap: 12px; padding: 0 14px; }
.orb { width: 70px; height: 70px; flex: none; border-radius: 50%; background: var(--gold); border: 4px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.orb b { font-family: var(--display); font-size: 1.4rem; font-weight: 400; line-height: 1; }
.orb small { font-size: .7rem; }
.msgs { flex: 1; min-width: 0; min-height: 48px; }
.msgs p { margin: 1px 0; font-size: .92rem; }
.m-fail, .m-backfire, .m-curse, .m-stress { color: var(--bad); }
.m-next, .m-reveal, .m-ally { color: var(--good); font-weight: 700; }
.m-bench { color: var(--sub); }
.endturn { min-width: 180px; }
.handrow { flex: 1; display: grid; grid-template-columns: 72px 1fr 72px; align-items: start; gap: 6px; padding: 0 10px 8px; min-height: 0; }
.pile { width: 64px; height: 88px; border: 3px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); display: flex; align-items: flex-end; justify-content: center; font-size: .72rem; color: #fff; padding-bottom: 4px; text-align: center; }
.pile.draw { background: repeating-linear-gradient(45deg, #5b6fb5 0 6px, #4a5ea3 6px 12px); }
.pile.disc { background: repeating-linear-gradient(45deg, #7a6aa8 0 6px, #6b5b99 6px 12px); }
.hand { display: flex; justify-content: center; align-items: flex-start; gap: 0; min-width: 0; padding-top: 18px; }

/* カード */
.card { position: relative; flex: 0 1 152px; min-width: 104px; height: 196px; margin: 0 -4px; background: var(--paper); border: 3px solid var(--line); border-radius: var(--radius); padding: 8px 9px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; user-select: none; box-shadow: var(--shadow);
  transform: translateY(var(--lift, 0)) rotate(var(--rot, 0deg)); transition: transform .15s; }
.card::before { content: ""; height: 7px; border-radius: 3px; background: var(--basic); order: -1; margin-top: 4px; }
.card.selected { transform: translateY(-22px) rotate(0deg) scale(1.06); z-index: 3; box-shadow: 0 8px 0 var(--line); }
.card.off { filter: saturate(.3); opacity: .7; }
.card.temp { border-style: dashed; }
.card.deal { animation: deal .42s cubic-bezier(.2,.9,.3,1.15) both; }
.card .cost { position: absolute; top: -14px; left: -10px; width: 32px; height: 32px; border-radius: 50%; background: var(--gold); border: 3px solid var(--line); display: grid; place-items: center; font-family: var(--display); font-size: 1rem; }
.ctype { font-size: .72rem; color: var(--sub); text-align: right; order: -2; }
.cname { font-weight: 800; font-size: .98rem; line-height: 1.25; }
.cline { font-size: .78rem; color: var(--sub); line-height: 1.35; }
.fxs { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; }
.fx { font-size: .74rem; font-weight: 700; padding: 0 5px; border-radius: 5px; border: 2px solid var(--line); background: var(--panel); }
.fx.bad { color: var(--bad); border-color: var(--bad); }
.fx.trust, .fx.reveal { color: var(--good); border-color: var(--good); }
.chance { font-size: .7rem; color: var(--warn); }
.tags { display: flex; gap: 3px; flex-wrap: wrap; }
.tag { font-size: .7rem; padding: 0 5px; border-radius: 5px; border: 2px solid var(--sub); }
.tag.good { color: var(--good); border-color: var(--good); }
.tag.bad { color: var(--bad); border-color: var(--bad); }
.lock { font-size: .74rem; color: var(--bad); font-weight: 800; }
.ctx { font-size: .7rem; color: var(--sub); }
.t-think::before { background: var(--think); } .t-act::before { background: var(--act); } .t-relate::before { background: var(--relate); }
.t-calm::before { background: var(--calm); } .t-impulse::before { background: var(--impulse); } .t-curse::before { background: var(--curse); }
.t-curse { background: repeating-linear-gradient(45deg, var(--paper) 0 8px, #ece6f7 8px 16px); }

/* 報酬・休み・できごと */
.reward, .rest, .event { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.choices { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; padding-top: 14px; }
.choices .card { flex: none; width: 176px; height: auto; min-height: 210px; margin: 0; transform: none; }
.choices.small .card { width: 140px; min-height: 160px; }
.other { background: var(--panel); border: 3px solid var(--line); border-radius: var(--radius); padding: 8px 14px; max-width: 760px; box-shadow: var(--shadow); }
.supoffer { display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--paper); border: 3px solid var(--relate); border-radius: var(--radius); padding: 8px 16px; box-shadow: var(--shadow); }
.supoffer canvas { width: 60px; height: 60px; }
.two { display: flex; gap: 24px; }
.equip { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.equiplist { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.eq { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 130px; }
.eq canvas { width: 48px; height: 48px; }
.eq.on { background: #d3f5df; }
.eq small { color: var(--sub); }
.story { font-size: 1.15rem; max-width: 760px; }
.opts { display: flex; flex-direction: column; gap: 10px; min-width: 420px; }
.opt { text-align: left; font-size: 1.05rem; display: flex; flex-direction: column; align-items: flex-start; }
.result { font-size: 1.1rem; background: var(--panel); padding: 10px 14px; border-radius: var(--radius); border: 3px solid var(--line); }

/* 振り返り */
.end { max-width: 900px; margin: 0 auto; width: 100%; }
.verdict { font-size: 1.6rem; text-align: center; font-family: var(--display); }
.verdict.won { color: var(--good); }
.growlist { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.growlist li { background: var(--panel); border: 3px solid var(--line); box-shadow: inset 6px 0 0 var(--relate); padding: 8px 12px 8px 18px; border-radius: 8px; display: flex; flex-direction: column; }
.growlist li.unlock { box-shadow: inset 6px 0 0 var(--primary); }
.growlist b { font-size: 1.1rem; }
.praise { background: var(--panel); border: 3px solid var(--good); padding: 8px 12px; border-radius: var(--radius); font-weight: 800; color: var(--ink); }
.trustbox { margin-top: 10px; }
.trustchart { width: 100%; max-width: 520px; height: 120px; background: var(--panel); border: 3px solid var(--line); border-radius: var(--radius); }
.trustchart .tline { fill: none; stroke: var(--primary); stroke-width: 3; }
.trustchart circle.up { fill: var(--good); } .trustchart circle.down { fill: var(--bad); } .trustchart circle.flat { fill: var(--sub); }
.grad { color: var(--good); font-weight: 700; }
.reveals s { color: var(--sub); }
.reveals small { display: block; color: var(--sub); }
.grid4 { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 8px; }
.gh { font-weight: 800; text-align: center; align-self: end; }
.gh.side { align-self: center; text-align: right; }
.cell { background: var(--panel); border: 3px solid var(--line); border-radius: var(--radius); padding: 10px; min-height: 110px; }
.cell small { display: block; color: var(--sub); }
.cell .num { font-size: 1.6rem; font-family: var(--display); }
.cell.g-ng { box-shadow: inset 0 -6px 0 var(--good); }
.cell.i-ok { box-shadow: inset 0 -6px 0 var(--warn); }
.nav { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; }
.dots { color: var(--sub); font-family: var(--display); }

@keyframes bob { 50% { transform: translateY(-6px); } }
@keyframes flick { 50% { filter: drop-shadow(0 0 6px #7a32c8); } }
@keyframes pulse { 50% { opacity: .55; } }
@keyframes deal { from { transform: translate(-60vw, 40px) rotate(-25deg) scale(.4); opacity: 0; } to { transform: translateY(var(--lift, 0)) rotate(var(--rot, 0deg)); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.monster.f2 svg { width: 280px; height: 266px; display: block; animation: appear .35s ease-out both; }
@keyframes appear { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.nigates { display: flex; gap: 6px; }
.chip.nigate { box-shadow: inset 0 -4px 0 var(--curse); }

</style>
</head>
<body>
<div id="app"></div>
<script>
// カード・課題・できごと・文面の正本。数値と文面はここだけで定義する。
// 対象：小学3年。漢字は3年までの配当に寄せ、迷う字はひらがなにする。
(function (root) {
  'use strict';

  var STATS = {
    think: { name: 'かしこさ', verb: '考える' },
    act: { name: '行動', verb: '動く' },
    relate: { name: 'なかま力', verb: '関わる' }
  };

  var CTX_LABEL = { study: 'べんきょう', conflict: 'ぶつかり合い', join: '遊び・なかま', tease: 'からかい', stage: '発表', danger: 'あぶない場面' };

  var TYPE_LABEL = {
    think: '考える', act: '動く', relate: '関わる', calm: '整える',
    impulse: 'しょうどう', basic: 'きほん', curse: 'モヤモヤ'
  };

  // うまくいきやすさ（3段階）。児童には段階を見せず「失敗するかも」とだけ出す（段階の言い分けが分かりにくかったため）
  var CHANCE = {
    high: { p: 0.8, label: '失敗するかも' },
    mid: { p: 0.6, label: '失敗するかも' },
    low: { p: 0.35, label: '失敗するかも' }
  };

  var PLAYER = { maxYoyu: 50, energy: 3, hand: 5, statMax: 5, trustStart: 5, trustMax: 10 };

  var RULES = {
    stressThreshold: 0.3,      // 心の余裕がこの割合未満でカッとなるが手札にまざる
    growthUses: 3,             // 1回の戦いで同じ種類を3回使うと成長
    trustGainCapPerBattle: 2,  // カードによる信頼の上昇は1戦で2まで
    weak: 1.5, resist: 0.5, anxiety: 0.6,
    restHeal: 0.3, dangerChance: 0.25, distanceMul: 0.9, frozenTurns: 2, frozenRecover: 0.1, nigatePer: 8, nigateStress: 2, backfireGrow: 3, moyaDrain: 2, allyTrust: 7, allyGuard: 6, hpScale: 1.7, stressScale: 1.45,
    rewardChoices: 3, rewardChoicesHighTrust: 4, highTrust: 8, lowTrust: 3
  };

  // ctx: そのカードが合う場面。書いていないカードはどの場面でも使える。合わない場面では、その戦いの間 山札から外す
  // judge: good=向社会的・アサーティブ・整える／impulse=しょうどう／neutral=きほん
  // style: 振り返りのアサーション3分類（aggressive/passive/assertive）
  var CARDS = {
    // --- 初期デッキ ---
    try_it: { name: 'トライする', line: 'とにかく 一度 やってみる。', type: 'act', judge: 'neutral', style: 'assertive', cost: 1, solve: 5, ctx: ['study', 'join', 'stage'] },
    endure: { name: 'がまんする', line: 'ぐっと こらえる。', type: 'basic', judge: 'neutral', style: 'passive', cost: 1, guard: 5 },
    breathe: { name: '深こきゅう', line: 'ゆっくり 3回 いきをすう。', type: 'calm', judge: 'good', style: 'assertive', cost: 1, guard: 4, draw: 1 },
    talk: { name: '話してみる', line: '「ねえ、ちょっといい？」', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 4 },
    keep_distance: { name: 'きょりを おく', line: '「ちょっと はなれて、頭を ひやそう」', type: 'calm', judge: 'good', style: 'distance', cost: 1, guard: 6, distance: true },
    run_away: { name: 'その場を はなれる（にげる）', line: 'あぶないと 思ったら、すぐに その場を はなれる。', type: 'act', judge: 'good', style: 'distance', cost: 1, escape: true },
    okoru: { name: '怒る', line: '「もう、なんなの！」と どなる。', type: 'impulse', judge: 'impulse', style: 'aggressive', cost: 0, solve: 9, chance: 'high', trust: -1, curse: true },

    // --- 報酬で手に入るカード ---
    write_plan: { name: 'やることを紙に書く', line: '1. 2. 3. と じゅんばんに書く。', type: 'think', judge: 'good', style: 'assertive', cost: 1, solve: 4, draw: 1, ctx: ['study', 'stage'] },
    their_view: { name: '相手の気もちを考える', line: '「あの子は どう思ったかな？」', type: 'think', judge: 'good', style: 'assertive', cost: 1, guard: 4, organize: true, ctx: ['conflict', 'join', 'tease'] },
    start_now: { name: 'すぐ取りかかる', line: 'あとまわしに しない。', type: 'act', judge: 'good', style: 'assertive', cost: 1, solve: 8, ctx: ['study', 'stage'] },
    move_body: { name: '体を動かして 気分てんかん', line: '休み時間に 外で走る。', type: 'act', judge: 'good', style: 'assertive', cost: 1, heal: 5, exhaust: true },
    together: { name: '「いっしょにやろう」', line: '「いっしょにやろう」と 声をかける。', type: 'relate', judge: 'good', style: 'assertive', cost: 1, solve: 6, trust: 1, chance: 'high', ctx: ['study', 'join'] },

  // --- マップ ---
  function chooseNode(s, col) {
    if (s.phase !== 'map') throw new Error('not map');
    var kind = s.map[s.row][col];
    if (!kind) throw new Error('bad node');
    s.floor++;
    var act = D.ACTS[s.act];
    if (kind === 'battle' && act.dangers && rand(s) < D.RULES.dangerChance) {
      startBattle(s, pick(s, act.dangers));
    } else if (kind === 'battle') {
      var pool = act.normals.filter(function (e) { return s.usedNormals.indexOf(e) < 0; });
      if (!pool.length) pool = act.normals.slice();
      var eid = pick(s, pool); s.usedNormals.push(eid);
      startBattle(s, eid);
    } else if (kind === 'elite') startBattle(s, pick(s, act.elites));
    else if (kind === 'boss') startBattle(s, act.boss);
    else if (kind === 'event') startEvent(s);
    else if (kind === 'rest') { s.phase = 'rest'; }
    s.nodeKind = kind;
    return s;
  }

  function advance(s) {
    s.row++;
    s.phase = 'map';
    s.battle = null; s.reward = null; s.event = null;
    return s;
  }

  // --- 戦い ---
  function startBattle(s, eid) {
    var E = D.ENEMIES[eid];
    var en = {
      id: eid, name: E.forms[0], form: 0, hp: Math.round(E.hp * D.RULES.hpScale), maxHp: Math.round(E.hp * D.RULES.hpScale), kind: E.kind, str: 0, mi: 0,
      revealed: false, weak: E.weak.slice(), resist: E.resist.slice(),
      backfire: (E.backfire || []).slice(), stressMul: 1
    };
    var bench = [], cards = [];
    s.deck.forEach(function (id) { (fits(id, E.ctx) ? cards : bench).push({ id: id }); });
    var draw = shuffle(s, cards);
    s.battle = {
      enemy: en, draw: draw, hand: [], discard: [], exhaust: [], bench: bench,
      energy: 0, guard: 0, turn: 0, calm: false,
      usage: { think: 0, act: 0, relate: 0 }, trustGained: 0, playedOk: {}, msgs: [], usedItems: {}, teacherCard: null
    };
    s.phase = 'battle';
    if (s.stats.think >= D.FORMS.organizeStat) { organize(s, true); }
    if (bench.length) msg(s, 'この場面に 合わないカード ' + bench.length + 'まいは、今回は 休み。', 'bench');
    log(s, { k: 'battle', enemy: eid, kind: E.kind, bench: bench.length });
    startTurn(s, true);
  }

  function drawCards(s, n) {
    var b = s.battle;
    for (var i = 0; i < n; i++) {
      if (!b.draw.length) {
        if (!b.discard.length) return;
        b.draw = shuffle(s, b.discard); b.discard = [];
      }
      b.hand.push(b.draw.pop());
    }
  }

  function startTurn(s, first) {
    var b = s.battle;
    b.turn++; b.energy = D.PLAYER.energy; b.guard = 0; b.calm = false;
    if (first && s.trust >= D.RULES.allyTrust) {
      b.guard += D.RULES.allyGuard;
      msg(s, '信頼が 高いので、友だちが そばにいてくれる（ゆとり +' + D.RULES.allyGuard + '）', 'ally');
      log(s, { k: 'ally' });
    }
    if (first) {
      D.ENEMIES[b.enemy.id].situ.forEach(function (id) { b.hand.push({ id: id, temp: true }); });
    }
    if (b.frozen) {
      b.hand.forEach(function (h) { b.discard.push(h); });
      b.hand = [{ id: 'ugokenai', temp: true }];
      b.energy = 0;
      msg(s, '心の余裕が なくなって、動けない…（このまま 時間が すぎるのを まつ）', 'stress');
      return;
    }
    drawCards(s, D.PLAYER.hand);
    if (s.yoyu < s.maxYoyu * D.RULES.stressThreshold) {
      b.hand.push({ id: 'kattonaru', temp: true });
      msg(s, D.TEXT.stressIntrude, 'stress');
      log(s, { k: 'intrude' });
    }
  }

  function msg(s, text, tag) { if (s.battle) s.battle.msgs.push({ text: text, tag: tag || '' }); }

  function addTrust(s, d, why, fromCard) {
    if (d > 0 && fromCard) {
      var room = D.RULES.trustGainCapPerBattle - s.battle.trustGained;
      d = Math.min(d, Math.max(0, room));
      if (d <= 0) return 0;
      s.battle.trustGained += d;
    }
    var before = s.trust;
    s.trust = Math.max(0, Math.min(D.PLAYER.trustMax, s.trust + d));
    var real = s.trust - before;
    if (real !== 0) {
      log(s, { k: 'trust', d: real, v: s.trust, why: why });
      noteUnlocks(s, before, null);
    }
    return real;
  }

  // カードの使用条件が新たに満たされたら記録する
  function noteUnlocks(s, trustBefore, statsBefore) {
    var seen = {};
    s.deck.concat(D.REWARD_POOL).forEach(function (id) {
      if (seen[id]) return; seen[id] = 1;
      var c = card(id); if (!c.req) return;
      var prev = { trust: trustBefore == null ? s.trust : trustBefore, stats: statsBefore || s.stats };
      var was = meetsReqWith(prev, c), now = meetsReq(s, c);
      if (!was && now) log(s, { k: 'unlock', card: id });
    });
  }
  function meetsReqWith(p, c) {
    for (var k in c.req) {
      if (k === 'trust') { if (p.trust < c.req.trust) return false; }
      else if ((p.stats[k] || 0) < c.req[k]) return false;
    }
    return true;
  }

  // 状きょうを整理する：かいぶつ→現実＋オーラ→ふつうの現実。いきおいが弱まる
  function organize(s, fromStat) {
    var b = s.battle, en = b.enemy, E = D.ENEMIES[en.id];
    if (en.form >= 2) return;
    var from = en.name;
    en.form++;
    en.name = E.forms[en.form];
    en.str = Math.floor(en.str / 2);
    en.stressMul = D.FORMS.stressMul[en.form];
    if (en.form === 2) {
      en.revealed = true;
      if (E.view) {
        en.weak = E.view.weak.slice(); en.resist = E.view.resist.slice();
        en.backfire = E.view.backfire.slice(); en.stressMul *= E.view.stressMul;
      }
      log(s, { k: 'reveal', enemy: en.id, from: E.forms[0], to: en.name, truth: E.view ? E.view.truth : 'plain' });
    }
    msg(s, fromStat ? 'かしこさが 高いので、はじめから「' + en.name + '」に 見えている。' : '状きょうが 整理できた：「' + from + '」→「' + en.name + '」（いきおいが 弱まった）', 'reveal');
    log(s, { k: 'form', enemy: en.id, form: en.form, stat: !!fromStat });
  }

  function solveAmount(s, c) {
    var b = s.battle, en = b.enemy, st = statOf(c);
    var n = c.solve + (st ? s.stats[st] : 0);
    var m = 1;
    if (en.weak.indexOf(c.type) >= 0) m *= D.RULES.weak;
    if (en.resist.indexOf(c.type) >= 0) m *= D.RULES.resist;
    if (D.ENEMIES[en.id].anxiety && !b.calm) m *= D.RULES.anxiety;
    return Math.round(n * m);
  }

  // カードの効き方を画面に出すための見積もり（乱数は使わない）
  function preview(s, i) {
    var b = s.battle, h = b.hand[i], c = card(h.id), st = statOf(c), en = b.enemy;
    var p = {};
    if (c.solve) {
      p.solve = solveAmount(s, c);
      p.backfire = en.backfire.indexOf(c.type) >= 0;
    }
    if (c.guard) p.guard = c.guard + (st ? s.stats[st] : 0);
    p.weak = en.weak.indexOf(c.type) >= 0;
    p.resist = en.resist.indexOf(c.type) >= 0;
    return p;
  }

  function playCard(s, i) {
    if (!canPlay(s, i)) throw new Error('cannot play');
    var b = s.battle, h = b.hand.splice(i, 1)[0], c = card(h.id), st = statOf(c), en = b.enemy;
    b.energy -= c.cost;
    if (st) b.usage[st]++;
    if (c.type === 'calm') b.calm = true;

    var ok = c.chance ? rand(s) < D.CHANCE[c.chance].p : true;
    var entry = { k: 'play', card: h.id, enemy: en.id, ok: ok, judge: c.judge, style: c.style, temp: !!h.temp, revealedBefore: en.revealed };

    if (c.trust) addTrust(s, c.trust, h.id, c.trust > 0);

    if (ok) {
      if (c.organize) organize(s);
      if (c.distance && !b.distanced) {
        b.distanced = true; en.str = 0; en.stressMul *= D.RULES.distanceMul;
        msg(s, 'きょりを おいた。問題の いきおいが おさまり、ストレスも 弱まった。', 'reveal');
      }
      if (c.solve) {
        var n = solveAmount(s, c);
        en.hp -= n; entry.solve = n;
        if (en.backfire.indexOf(c.type) >= 0) {
          en.str += D.RULES.backfireGrow;
          entry.backfire = D.RULES.backfireGrow;
          msg(s, '「' + c.name + '」で その場は おさまった。でも あとで こじれて、問題の いきおい +' + D.RULES.backfireGrow + '。', 'backfire');
        }
      }
      if (c.guard) b.guard += c.guard + (st ? s.stats[st] : 0);
      if (c.heal) s.yoyu = Math.min(s.maxYoyu, s.yoyu + c.heal);
      if (c.draw) drawCards(s, c.draw);
      if (c.judge === 'impulse' && !entry.backfire) msg(s, '「' + c.name + '」で すっきりした。でも…', 'impulse');
    } else {
      var cause = D.TEXT.failCause[Math.floor(rand(s) * D.TEXT.failCause.length)];
      msg(s, '「' + c.name + '」は うまくいかなかった。' + cause + (st ? '（' + D.STATS[st].name + 'の けいけんには なった）' : ''), 'fail');
      if (c.fail) {
        b.hand.push({ id: c.fail, temp: true });
        msg(s, '次の手：「' + card(c.fail).name + '」が 手札に 入った。', 'next');
        entry.next = c.fail;
      }
    }
    if (c.curse) {
      s.deck.push('moyamoya'); b.discard.push({ id: 'moyamoya' });
      msg(s, D.TEXT.curseGained, 'curse');
      log(s, { k: 'curse', why: h.id });
    }
    if (ok && h.temp && c.judge === 'good') b.playedOk[h.id] = 1;
    log(s, entry);

    if (h.temp || c.exhaust) b.exhaust.push(h); else b.discard.push(h);
    if (ok && c.escape) { escapeBattle(s); return s; }
    if (en.hp <= 0) winBattle(s);
    return s;
  }

  // 苦手意識：その場面では ストレスが ふえる
  function stressOf(s, mv) {
    var en = s.battle.enemy, ctx = D.ENEMIES[en.id].ctx;
    var ng = (s.nigate[ctx] || 0) * D.RULES.nigateStress;
    return Math.round((mv.n * D.RULES.stressScale + en.str + ng) * en.stressMul);
  }
  // 心の余裕は0より下がらない。下がった分は「動けない」中の つらさとして数える
  function hurt(s, dmg) {
    var b = s.battle;
    if (dmg > s.yoyu) {
      if (b) b.deficit = (b.deficit || 0) + (dmg - s.yoyu);
      s.yoyu = 0;
    } else s.yoyu -= dmg;
    if (s.yoyu <= 0 && b && !b.frozen) {
      b.frozen = true; b.frozenLeft = D.RULES.frozenTurns;
      log(s, { k: 'frozen', enemy: b.enemy.id });
    }
  }

  function enemyAct(s) {
    var b = s.battle, en = b.enemy, E = D.ENEMIES[en.id];
    var mv = E.moves[en.mi % E.moves.length];
    en.mi++;
    if (mv.t === 'stress') {
      var n = stressOf(s, mv);
      var blocked = Math.min(b.guard, n);
      var dmg = n - blocked;
      hurt(s, dmg);
      msg(s, mv.say + '（心の余裕 −' + dmg + (blocked ? '、ゆとりで ' + blocked + ' うけとめた' : '') + '）', 'hit');
    } else if (mv.t === 'grow') {
      en.str += mv.n;
      msg(s, mv.say + '（問題の いきおい +' + mv.n + '）', 'grow');
    } else if (mv.t === 'worry') {
      b.discard.push({ id: 'moyamoya', temp: true });
      msg(s, mv.say + '（この戦いの間 モヤモヤが まざる）', 'worry');
    }
  }

  // 次に起きそうなこと（意図の表示）
  function intent(s) {
    var b = s.battle, en = b.enemy, E = D.ENEMIES[en.id];
    var mv = E.moves[en.mi % E.moves.length];
    var o = { t: mv.t, say: mv.say };
    if (mv.t === 'stress') o.n = stressOf(s, mv);
    if (mv.t === 'grow') o.n = mv.n;
    if (E.pass) o.passIn = E.pass.turns - b.turn + 1;
    return o;
  }

  function endTurn(s) {
    if (s.phase !== 'battle') throw new Error('not battle');
    var b = s.battle;
    b.msgs = [];
    var moya = 0;
    b.hand.forEach(function (h) {
      if (h.id === 'moyamoya') moya++;
      if (h.id === 'kattonaru') b.exhaust.push(h); else b.discard.push(h);
    });
    if (moya) {
      hurt(s, moya * D.RULES.moyaDrain);
      msg(s, 'モヤモヤが 気になって 心の余裕 −' + moya * D.RULES.moyaDrain, 'curse');
    }
    b.hand = [];
    var wasFrozen = b.frozen;
    enemyAct(s);
    if (wasFrozen) {
      b.frozenLeft--;
      if (b.frozenLeft <= 0) { endFrozen(s); return s; }
    }
    var ps = D.ENEMIES[b.enemy.id].pass;
    if (ps && b.turn >= ps.turns) { if (b.frozen) endFrozen(s); else winBattle(s, true); return s; }
    startTurn(s, false);
    return s;
  }

  // 動けないまま 時間が すぎた：苦手意識が つき、心の余裕は 1割まで もどる
  function endFrozen(s) {
    var b = s.battle, en = b.enemy, E = D.ENEMIES[en.id];
    var lv = Math.max(1, Math.ceil((b.deficit || 0) / D.RULES.nigatePer));
    s.nigate[E.ctx] = (s.nigate[E.ctx] || 0) + lv;
    s.yoyu = Math.max(1, Math.round(s.maxYoyu * D.RULES.frozenRecover));
    log(s, { k: 'nigate', ctx: E.ctx, add: lv, to: s.nigate[E.ctx], enemy: en.id });
    log(s, { k: 'win', enemy: en.id, other: E.other, revealed: en.revealed, frozen: true });
    if (en.kind === 'boss') { endRun(s, false); return; }
    s.phase = 'reward';
    s.reward = { choices: [], other: E.other, support: null, frozen: { ctx: E.ctx, add: lv, to: s.nigate[E.ctx] } };
  }

  // にげる：あぶない場面なら 正解（ふつうに 乗りこえた あつかい）。ふつうの課題では 問題が のこる
  function escapeBattle(s) {
    var b = s.battle, en = b.enemy, E = D.ENEMIES[en.id];
    log(s, { k: 'escape', enemy: en.id, ok: !!E.escapeOk });
    if (E.escapeOk) {
      addTrust(s, 1, 'escape', false);
      winBattle(s, false, true);
      return;
    }
    s.deck.push('moyamoya'); log(s, { k: 'curse', why: 'flee:' + en.id });
    log(s, { k: 'win', enemy: en.id, other: E.other, revealed: en.revealed, fled: true });
    if (en.kind === 'boss') { endRun(s, false); return; }
    s.phase = 'reward';
    s.reward = { choices: [], other: E.other, support: null, fled: true };
  }

  function winBattle(s, passed, escaped) {
    var b = s.battle, en = b.enemy, E = D.ENEMIES[en.id];
    log(s, { k: 'win', enemy: en.id, other: E.other, revealed: en.revealed, passed: !!passed, escaped: !!escaped });
    if (passed && E.pass.leave) { s.deck.push('moyamoya'); log(s, { k: 'curse', why: 'pass:' + en.id }); }
    var statsBefore = { think: s.stats.think, act: s.stats.act, relate: s.stats.relate };
    Object.keys(D.STATS).forEach(function (st) {
      if (b.usage[st] >= D.RULES.growthUses && s.stats[st] < D.PLAYER.statMax) {
        s.stats[st]++;
        log(s, { k: 'grow', stat: st, to: s.stats[st], uses: b.usage[st], why: 'use' });
      }
    });
    if (en.kind === 'elite') {
      var top = Object.keys(D.STATS).sort(function (a, c) { return b.usage[c] - b.usage[a]; })[0];
      if (b.usage[top] > 0 && s.stats[top] < D.PLAYER.statMax) {
        s.stats[top]++;
        log(s, { k: 'grow', stat: top, to: s.stats[top], uses: b.usage[top], why: 'elite' });
      }
    }
    noteUnlocks(s, s.trust, statsBefore);
    if (en.kind === 'boss') { endRun(s, true); return; }
    s.phase = 'reward';
    if (passed) {
      s.reward = { choices: [], other: E.other, support: null, passed: E.pass.say, leave: !!E.pass.leave };
      return;
    }
    var sup = null;
    var unowned = Object.keys(D.SUPPORTS).filter(function (k) { return s.items.indexOf(k) < 0; });
    if (unowned.length && (en.kind === 'elite' || rand(s) < D.SUPPORT_RULES.rewardChance)) sup = pick(s, unowned);
    s.reward = { choices: rewardChoices(s), other: E.other, support: sup, escaped: !!escaped };
  }

  function rewardChoices(s) {
    var b = s.battle;
    var want = s.trust >= D.RULES.highTrust ? D.RULES.rewardChoicesHighTrust : D.RULES.rewardChoices;
    var situ = shuffle(s, Object.keys(b.playedOk)).slice(0, 2);
    if (b.teacherCard && situ.indexOf(b.teacherCard) < 0) situ = [b.teacherCard].concat(situ).slice(0, 2);
    var pool = shuffle(s, D.REWARD_POOL.filter(function (id) { return situ.indexOf(id) < 0; }));
    return situ.concat(pool).slice(0, want);
  }

  function gainSupport(s, id, why) {
    if (s.items.indexOf(id) >= 0) return false;
    s.items.push(id);
    if (s.equip.length < D.SUPPORT_RULES.slots) s.equip.push(id);
    log(s, { k: 'support', id: id, why: why });
    return true;
  }

  function takeSupport(s) {
    if (s.phase !== 'reward' || !s.reward.support) throw new Error('no support');
    gainSupport(s, s.reward.support, 'reward'); s.reward.support = null;
    return s;
  }

  function canUseSupport(s, id) {
    return s.phase === 'battle' && s.equip.indexOf(id) >= 0 && !s.battle.usedItems[id];
  }

  function useSupport(s, id) {
    if (!canUseSupport(s, id)) throw new Error('cannot use item');
    var u = D.SUPPORTS[id], b = s.battle, en = b.enemy, E = D.ENEMIES[en.id];
    b.usedItems[id] = 1;
    msg(s, '「' + u.name + '」', 'ally');
    if (u.heal) s.yoyu = Math.min(s.maxYoyu, s.yoyu + u.heal);
    if (id === 'teacher') {
      var tc = D.TEACHER_CARDS[E.ctx];
      b.hand.push({ id: tc, temp: true }); b.teacherCard = tc;
      msg(s, '先生の すすめ：「' + card(tc).name + '」が 手札に 入った。', 'next');
      organize(s);
    }
    if (id === 'friend') {
      var fc = rand(s) < D.SUPPORT_RULES.junkChance ? 'junk_advice' : pick(s, D.FRIEND_CARDS);
      s.deck.push(fc); b.hand.push({ id: fc });
      log(s, { k: 'gain', card: fc, why: 'friend' });
      msg(s, '友だちの アドバイス：「' + card(fc).name + '」' + (fc === 'junk_advice' ? '（あまり 役に立たなかった…）' : ''), fc === 'junk_advice' ? 'fail' : 'next');
    }
    if (u.clearMoya) {
      var n = 0;
      b.hand = b.hand.filter(function (h) { if (h.id === 'moyamoya') { b.discard.push(h); n++; return false; } return true; });
      if (n) msg(s, 'モヤモヤが ' + n + 'まい 気にならなくなった。', 'reveal');
    }
    log(s, { k: 'useSupport', id: id, enemy: en.id });
    return s;
  }

  // ひと休みで、つけるアイテムを えらび直す
  function setEquip(s, ids) {
    if (s.phase !== 'rest') throw new Error('not rest');
    if (ids.length > D.SUPPORT_RULES.slots) throw new Error('too many');
    ids.forEach(function (id) { if (s.items.indexOf(id) < 0) throw new Error('not owned'); });
    s.equip = ids.slice();
    return s;
  }

  function pickReward(s, id) {
    if (s.phase !== 'reward') throw new Error('not reward');
    if (id) {
      if (s.reward.choices.indexOf(id) < 0) throw new Error('bad reward');
      s.deck.push(id);
      log(s, { k: 'gain', card: id, why: 'reward' });
    } else log(s, { k: 'skip' });
    return advance(s);
  }

  // --- ひと休み ---
  function rest(s, choice, deckIdx) {
    if (s.phase !== 'rest') throw new Error('not rest');
    if (choice === 'rest') {
      var before = s.yoyu;
      s.yoyu = Math.min(s.maxYoyu, s.yoyu + Math.round(s.maxYoyu * D.RULES.restHeal));
      log(s, { k: 'rest', d: s.yoyu - before });
    } else if (choice === 'remove') {
      var id = s.deck[deckIdx];
      if (!id) throw new Error('bad card');
      s.deck.splice(deckIdx, 1);
      log(s, { k: 'remove', card: id });
    } else throw new Error('bad choice');
    return advance(s);
  }

  // --- できごと ---
  function startEvent(s) {
    var act = D.ACTS[s.act];
    var id;
    if (s.trust <= D.RULES.lowTrust && s.usedEvents.indexOf('second_chance') < 0) id = 'second_chance';
    else {
      var pool = act.events.filter(function (e) { return s.usedEvents.indexOf(e) < 0; });
      id = pick(s, pool.length ? pool : act.events);
    }
    s.usedEvents.push(id);
    s.event = { id: id, done: null };
    s.phase = 'event';

      var names = {};
      sm.supportUses.forEach(function (e) { names[D.SUPPORTS[e.id].name] = 1; });
      items.push(h('li', { class: 'unlock' }, [h('b', { text: 'こまったとき、' + Object.keys(names).map(function (n) { return '「' + n + '」'; }).join('・') + 'に たよれた' }), h('span', { text: 'たよれる人や ものを 使えるのも、大事な力。' })]));
    }
    sm.unlocks.forEach(function (id) {
      items.push(h('li', { class: 'unlock' }, [h('b', { text: cardName(id) + 'が 使えるようになった' }), h('span', { text: '育った力と 信頼で、できることが ふえた。' })]));
    });
    var trustUps = sm.trustLine.filter(function (e) { return e.d > 0; });
    var trustBox = h('div', { class: 'trustbox' }, [
      h('h3', { text: '信頼 ' + sm.trustStart + ' → ' + sm.trust }),
      trustChart(sm.trustLine),
      h('ul', {}, groupUps(trustUps).map(function (g) { return h('li', { text: '+' + g.d + '：' + whyText(g.why) + (g.n > 1 ? '（' + g.n + '回）' : '') }); })),
      sm.recovered.length ? h('p', { class: 'praise', text: '信頼が 下がったあと、自分の行動で 取りもどした。それは とても 大事な力。' }) : null
    ]);
    var cards = [];
    sm.gained.forEach(function (g) { cards.push(h('li', { text: cardName(g.card) + 'を 手に入れた（選択肢が ふえた）' })); });
    sm.removed.forEach(function (g) { cards.push(h('li', { class: 'grad', text: cardName(g.card) + 'を 卒業した' })); });
    var fallback = null;
    if (!items.length && !trustUps.length && !cards.length) {
      var most = mostUsed();
      fallback = h('p', { class: 'praise', text: '今回は ' + (most ? cardName(most) + 'で たくさん 乗りこえた。' : 'さいごまで あきらめずに 考えた。') + '次は「わからないと言う」や「いっしょにやろう」も ためせるよ。' });
    }
    return [
      h('h2', { text: 'そだったもの' }),
      h('ul', { class: 'growlist' }, items),
      fallback,
      trustBox,
      cards.length ? h('div', {}, [h('h3', { text: '選択肢' }), h('ul', {}, cards)]) : null
    ];
  }
  function groupUps(ups) {
    var by = {}, order = [];
    ups.forEach(function (e) {
      if (!by[e.why]) { by[e.why] = { why: e.why, d: 0, n: 0 }; order.push(e.why); }
      by[e.why].d += e.d; by[e.why].n++;
    });
    return order.map(function (k) { return by[k]; });
  }
  function mostUsed() {
    var cnt = {};
    S.log.forEach(function (e) { if (e.k === 'play') cnt[e.card] = (cnt[e.card] || 0) + 1; });
    var best = null;
    Object.keys(cnt).forEach(function (k) { if (!best || cnt[k] > cnt[best]) best = k; });
    return best;
  }

  function debriefView(sm) {
    return [
      h('h2', { text: '見方が 変わった・見つけた' }),
      sm.reveals.length ? h('ul', { class: 'reveals' }, sm.reveals.map(function (r) {
        return h('li', {}, [h('s', { text: r.from }), ' → ', h('b', { text: r.to }),
          h('small', { text: r.truth === 'hostile' ? '（たしかめたら、ほんとうに いやなことだった。だから 先生に つたえるのが 大事）' : '（たしかめたら、わざとじゃなかった）' })]);
      })) : h('p', { text: '今回は「見方を 変える」カードを 使わなかった。次は「相手の ようすを見る」を ためしてみよう。' }),
      h('h3', { text: 'この場面で、こんな 選択肢が あった' }),
      h('ul', {}, sm.discovered.map(function (d) { return h('li', { text: D.ENEMIES[d.enemy].scene + '：' + cardName(d.card) }); })),
      h('h3', { text: '相手から 見ると' }),
      h('ul', { class: 'others' }, sm.others.map(function (o) { return h('li', { text: o.other }); }))
    ];
  }

  function debriefGrid(sm) {
    function cell(cls, title, sub, list) {
      var ex = list[0];
      return h('div', { class: 'cell ' + cls }, [
        h('b', { text: title }), h('small', { text: sub }),
        h('div', { class: 'num', text: list.length + '回' }),
        ex ? h('p', { text: '例：' + cardName(ex.card) }) : null
      ]);
    }
    var g = sm.grid;
    return [
      h('h2', { text: '選び方と 結果' }),
      h('div', { class: 'grid4' }, [
        h('div', {}), h('div', { class: 'gh', text: 'うまくいった' }), h('div', { class: 'gh', text: 'うまくいかなかった' }),
        h('div', { class: 'gh side', text: 'よい選び方' }),
        cell('g-ok', 'よかった', '', g.goodOk),
        cell('g-ng', 'ナイストライ', '選び方は よかった。こういう日も ある', g.goodNg),
        h('div', { class: 'gh side', text: 'しょうどう' }),
        cell('i-ok', 'ラッキー（でもモヤモヤ）', 'その場は おさまったけど…', g.impOk),
        cell('i-ng', 'うまくいかなかった', '', g.impNg)
      ]),
      h('p', { class: 'hint', text: '結果だけで、選び方の よしあしは きまらない。ほんとうの 生活なら、どれを えらぶ？' })
    ];
  }

  function endScreen() {
    var sm = E.summary(S);
    var pages = [debriefGrow, debriefView, debriefGrid];
    var body = pages[debriefPage](sm);
    var nav = h('div', { class: 'nav' }, [
      debriefPage > 0 ? h('button', { class: 'secondary', onclick: function () { debriefPage--; render(); }, text: 'もどる' }) : h('span'),
      h('span', { class: 'dots', text: (debriefPage + 1) + ' / ' + pages.length }),
      debriefPage < pages.length - 1
        ? h('button', { class: 'primary', onclick: function () { debriefPage++; render(); }, text: '次へ' })
        : h('button', { class: 'primary', onclick: function () { P.clear(); start(); }, text: 'もう一回' })
    ]);
    return h('main', { class: 'end' }, [
      h('p', { class: 'verdict ' + (sm.won ? 'won' : 'lost'), text: sm.won ? D.TEXT.win : D.TEXT.lose })
    ].concat(body, [nav]));
  }

  function render() {
    if (!S) return;
    var screen;
    if (S.phase === 'map') screen = mapScreen();
    else if (S.phase === 'battle') screen = battleScreen();
    else if (S.phase === 'reward') screen = rewardScreen();
    else if (S.phase === 'rest') screen = restScreen();
    else if (S.phase === 'event') screen = eventScreen();
    else screen = endScreen();
    app.replaceChildren(topBar(), screen);
    app.setAttribute('data-phase', S.phase);
  }

  function boot() {
    app = document.getElementById('app');
    P.load(function (saved) {
      if (saved && saved.ver === E.ENGINE_VER && saved.phase !== 'end') titleScreen(saved);
      else titleScreen(null);
    });
  }

  root.SST_UI = { boot: boot, _state: function () { return S; } };
})(this);

SST_UI.boot();
</script>
</body>
</html>
